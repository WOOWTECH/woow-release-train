  # ================================================================ Hermes
  # 上游身分＝docker.io/nousresearch/hermes-agent 的 index digest。HA 直接 FROM；PaaS 在 paas-odoo-ci
  # 以同一 digest 為底建 Woow 衍生映像（seed 釘的是衍生映像，不是上游 digest，所以 seed 只列參考）。
  hermes:
    display_name: Hermes Agent
    upstream:
      image: docker.io/nousresearch/hermes-agent
      source: "github:NousResearch/hermes-agent"
      tag_pattern: "v{version}"     # v0.21.0 以前是日曆 tag（v2026.8.31＝v0.21.0）；上游 tag 會被重推，一律以 digest 為準
      image_tag: "v{version}"       # propose 到 registry 查的 tag
    policy:
      mode: range
      min_version: "0.22.5"         # 已驗證內含 X-FIX-CVE 全部 8 項相依修補（paas-odoo-ci hermes-agent/Dockerfile:80；0.21.6 靠 hash 鎖定 overlay，4749031 已移除）
      max_days_behind: 30
      downgrade: forbidden          # state.db／config schema 單向（HA CHANGELOG 0.1.10 末句；seed 0.3.6 註解）
      upgrade_evidence: required
      hard_rules: []
    target:
      version: "0.22.5"
      since: "2026-10-23"           # 上游 release 2026-10-23T05:28Z；HA add-on 0.1.10 同日發佈
      index_digest: "sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d"
      platforms:
        amd64: "sha256:fd822bae0a61bf023450737edbeaeea5fc6460f17cb4ee240a7e67b306ed63fb"
        arm64: "sha256:41f1cfdd2486b38ca55453a28785910b498ee184e71eed4f2d7ee3f908aa7236"
      verified: "2026-10-23T22:32Z crane manifest docker.io/nousresearch/hermes-agent:v0.22.5（stable／latest 同 digest；release commit bf0203a7…）"
    known_versions:
      - version: "0.21.6"           # PaaS CI 2026-10-11～10-23 的基底（claim tag rc.4-v0.21.6；上游 v0.21.6 tag 現指向 55e192fb…）
        index_digest: "sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784"
        platforms:
          amd64: "sha256:ffa4fbb471c2bc8c85fbcfc629347585cc1586c86d2e6db465d01203ce696d95"
          arm64: "sha256:7e36c10955df8bf957fbb034279770db17c5feab1733637608d1a1d9aceb8193"
      - version: "0.21.0"           # HA add-on 0.1.0～0.1.9 的基底（tag v2026.8.31）
        index_digest: "sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524"
        platforms:
          amd64: "sha256:87af7c6a5ee383834f75eb9a3fb509ccaacbab5d54084b086b48b84917e28efc"
          arm64: "sha256:c64666f62179b6cd7d2df3348a30907b383a82a8e0d2400083b8004e24615780"
    legs:
      ha:
        repo: "github:WOOWTECH/Woow_ha_hermes_add_on"
        ref: main
        pins:
          - {id: base-image, label: 上游 base 映像（tag＋digest）, file: hermes/Dockerfile, kind: dockerfile_arg, name: HERMES_BASE, parse: image_ref, compare: index_digest}
        package_version:
          - {label: add-on 版號, file: hermes/config.yaml, kind: yaml, path: version, bump: patch}
        fanout: {changelog: hermes/CHANGELOG.md}
        published: {kind: catalog, repo: "github:WOOWTECH/Woow_HA_App_Store", file: .addon-sync/catalog.json, id: woow-hermes}
      paas:
        pins:
          - {id: ci-base, label: paas-odoo-ci 建置 base（FROM digest）, repo: "gitea:woow-paas/paas-odoo-ci", ref: main, file: hermes-agent/Dockerfile, kind: dockerfile_from, parse: image_ref, compare: index_digest}
          - {id: chart, label: chart appVersion, repo: "gitea:woow-paas/woow-paas-charts", ref: main, file: charts/hermes-agent/Chart.yaml, kind: yaml, path: appVersion, compare: version}
          - id: seed-wrapper
            label: seed 映像（Woow 衍生，非上游身分）
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_image
            record: cloud_app_hermes_agent
            compare: info
        package_version:
          - label: seed chart 版號
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_field
            record: cloud_app_hermes_agent
            field: helm_chart_version
          - {label: charts 已發佈版號, repo: "gitea:woow-paas/woow-paas-charts", ref: main, file: charts/hermes-agent/Chart.yaml, kind: yaml, path: version, bump: patch}
    exceptions: []
    notes:
      - "PaaS 正式站 seed（v18.0.1.0.253）仍是 chart 0.3.12＋映像 20261018.0829（0.21.6 基底）；develop／v18.0.1.0.255 已是 0.3.13＋20261023.1631（0.22.5 基底）。"
      - "seed 衍生映像的 base digest 只存在映像 label io.woow.base.digest（需 JCR 憑證），所以 PaaS 的上游身分看 paas-odoo-ci FROM＋charts appVersion。"

  # ============================================================= OpenDesign
  # 共用核心 open-design-core：PaaS 每次建置都重建並以「與外殼相同的 tag」發佈；HA 的 Import open-design-core
  # workflow 依 digest 複製到 ghcr.io/woowtech/open-design-core。version 用 core build id（＝tag），上游版本與 fork commit 放 identity。
  opendesign:
    display_name: OpenDesign（WoowTech core）
    upstream:
      image: ghcr.io/woowtech/open-design-core
      source: "gitea:woow-paas/open-design"      # WoowTech fork；上游 github:nexu-io/open-design（open-design-v0.24.1）
    policy:
      mode: lockstep
      downgrade: allowed
      hard_rules: []
    target:
      version: "20261026.0712"      # core build id（core tag＝PaaS 外殼 tag）
      since: "2026-10-26"
      platforms:
        amd64: "sha256:366e337dc7ea192526468de33ad3f2f0ce97be3ffba9b8382a0c1d9ab88b1404"   # 單一架構 manifest（不是 index）
      identity:
        upstream_version: "0.24.1"
        fork_commit: "c8ae3900f9ff5d58f50d11f4055756f6e7f14a25"        # woow-od-v0.24.1-w2.5（原生 Paseo 入口、原子 MCP 註冊、手機操作）
        upstream_commit: "89e64d813bb1c7a11519b3f668f011f7017637d7"    # open-design-v0.24.1
      verified: "2026-10-26：建置 28347 通過原生預設啟動、Paseo 與完整 MCP 容器驗收；核可單 #419、promote run 28385，crane 讀回 JCR 正式 tag 與候選 digest 相同；依原 digest 複製至 GHCR，2026-10-26T07:29Z 匿名讀回一致。"
    known_versions:
      - {version: "20261024.0943", platforms: {amd64: "sha256:ffbb2bd070c488d79d960ee72fb7717f43791af6a4ae1585943598ad444a76e0"}}   # HA 0.2.5～0.2.6；fork w2.4
      - {version: "20261024.0713", platforms: {amd64: "sha256:bdb9febc456e48ee264ba506192b5d6553b65d9aadb132a45703b42af23b5aa8"}}   # fork w2.3；未上線（內建外掛只在「已安裝」分頁）
      - {version: "20261018.1219", platforms: {amd64: "sha256:f349632632e0c3fa9e546da8e83f89aa60d283d473fdf47fffa5728e01cde023"}}   # HA 0.2.3～0.2.4；fork w2.2
      - {version: "20261015.0617", platforms: {amd64: "sha256:c5496453136b5ddc1ec3376c0f7518bfb2ba5091ff1ba75bfadf645d1c52a683"}}   # HA 0.2.1～0.2.2 現用；無 OD_APP_VERSION（/api/version 回 0.23.1）
      - {version: "20261014.1921", platforms: {amd64: "sha256:bfec7cc6c96b559506f33dce9296d9c2e02e9acbb0fe543ad434ea66370baf35"}}   # GHCR 別名 0.24.1-w2.1
    legs:
      ha:
        repo: "github:WOOWTECH/Woow_ha_opendesign_add_on"
        ref: main
        pins:
          - {id: core-image, label: core 映像（Dockerfile，tag＋digest）, file: Dockerfile, kind: dockerfile_arg, name: BUILD_FROM, parse: image_ref, compare: platforms.amd64}
          - {id: core-image-ci, label: core 映像（build.yml CORE_IMAGE）, file: .github/workflows/build.yml, kind: yaml, path: env.CORE_IMAGE, parse: image_ref, compare: platforms.amd64}
          - {id: core-tag-dev, label: core tag（build.yaml，本機建置路徑）, file: build.yaml, kind: yaml, path: build_from.amd64, parse: image_ref, compare: version}
          - {id: core-contract-version, label: core 契約的 OpenDesign 版本, file: Dockerfile, kind: dockerfile_arg, name: CORE_OPENDESIGN_VERSION, compare: identity.upstream_version}
        package_version:
          - {label: add-on 版號, file: config.yaml, kind: yaml, path: version}
        published: {kind: catalog, repo: "github:WOOWTECH/Woow_HA_App_Store", file: .addon-sync/catalog.json, id: woow_ha_opendesign}
        fanout: {enabled: false, reason: "HA 先用 Import open-design-core workflow 把 core 匯入 GHCR，再跑 .github/scripts/pin-core.sh"}
      paas:
        pins:
          - id: shell-tag
            label: seed 外殼映像 tag（＝同一次建置的 core tag）
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_image
            record: cloud_app_opendesign
            tag_as_version: true
            compare: version
          - {id: test-core, label: PR 容器測試核心, repo: "gitea:woow-paas/paas-odoo-ci", ref: main, file: .gitea/workflows/test-open-design-mcp.yml, kind: yaml, path: jobs.mcp-e2e.env.TEST_CORE, parse: image_ref, compare: platforms.amd64}
          - {id: fork-commit, label: fork commit（od-source.env）, repo: "gitea:woow-paas/paas-odoo-ci", ref: main, file: open-design/od-source.env, kind: regex, pattern: '^OD_SOURCE_SHA=([0-9a-f]{40})\s*$', compare: identity.fork_commit}
          - {id: upstream-version, label: 上游 OpenDesign 版本（od-source.env）, repo: "gitea:woow-paas/paas-odoo-ci", ref: main, file: open-design/od-source.env, kind: regex, pattern: '^OD_UPSTREAM_VERSION=(\S+)\s*$', compare: identity.upstream_version}
          - {id: chart, label: chart appVersion, repo: "gitea:woow-paas/woow-paas-charts", ref: main, file: charts/open-design/Chart.yaml, kind: yaml, path: appVersion, compare: identity.upstream_version}
        package_version:
          - label: seed chart 版號
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_field
            record: cloud_app_opendesign
            field: helm_chart_version
          - {label: charts 已發佈版號, repo: "gitea:woow-paas/woow-paas-charts", ref: main, file: charts/open-design/Chart.yaml, kind: yaml, path: version}
        fanout: {enabled: false, reason: "core 由 paas-odoo-ci 每次建置重建，版本由 od-source.env 決定"}
    exceptions: []
    notes:
      - "PaaS 與 HA 外殼共用同一個不可變 open-design-core；原生 Paseo 入口與 MCP API 在核心編譯，兩端外殼另安裝共享 runtime 0.2.1，各自負責啟動與驗證邊界。"
      - "PaaS 商品 seed 記錄外殼 tag/digest；PR 測試另外釘相同核心 digest。既有 deployment_policy=pinned 服務保留原版本，商品預設更新不代表所有既有服務已更新。"


  # ============================================================== MCP 家族
  # HA＝WOOWTECH/Woow_ha_mcp_addons（預設分支 claude-delivery；程式在 apps/<p>、apps/runtime、packages/）。
  # PaaS＝Gitea WOOWTECH/woow-mcp-server main（Gitea 是來源，GitHub 私人庫每小時鏡像，兩邊 26 個 ref 相同）。
  # 建議 lockstep：兩邊都對上游版本打『版本專屬』patch 並有 digest／工具清單守線，落後等於跑不同程式，不是「舊一點」。
  mcp-n8n:
    display_name: n8n MCP（n8n-mcp）
    upstream: {package: "npm:n8n-mcp", source: "github:czlonkowski/n8n-mcp"}
    policy: {mode: lockstep, downgrade: allowed, hard_rules: []}
    target:
      version: "2.96.2"
      since: "2026-10-23"           # npm 發佈日
      verified: "2026-10-24 registry.npmjs.org/n8n-mcp latest＝2.96.2（engines node ^22.23.4 || ^24.22.1 || >=26.12.1）"
    legs:
      ha:
        fanout: {enabled: false, reason: "兩邊都對上游打版本專屬 patch／鎖檔，升版要人工重算"}
        repo: "github:WOOWTECH/Woow_ha_mcp_addons"
        ref: claude-delivery
        pins:
          - {id: package-json, label: package.json 相依, file: apps/n8n/package.json, kind: json, path: dependencies.n8n-mcp, compare: version}
          - {id: package-lock, label: package-lock.json 鎖定, file: apps/n8n/package-lock.json, kind: json, path: "packages.node_modules/n8n-mcp.version", compare: version}
        package_version:
          - {label: add-on 版號, file: addons/n8n/config.yaml, kind: yaml, path: version}
        published: {kind: catalog, repo: "github:WOOWTECH/Woow_HA_App_Store", file: .addon-sync/catalog.json, id: woow_mcp_n8n}
      paas:
        fanout: {enabled: false, reason: "兩邊都對上游打版本專屬 patch／鎖檔，升版要人工重算"}
        repo: "gitea:WOOWTECH/woow-mcp-server"
        ref: main
        pins:
          - {id: package-json, label: upstream-dependencies package.json 相依, file: apps/n8n/upstream-dependencies/package.json, kind: json, path: dependencies.n8n-mcp, compare: version}
          - {id: package-lock, label: upstream-dependencies package-lock.json 鎖定, file: apps/n8n/upstream-dependencies/package-lock.json, kind: json, path: "packages.node_modules/n8n-mcp.version", compare: version}
          - {id: patch-guard-result, label: isError patch 的版本守線, file: apps/n8n/n8n_mcp_admin/upstream_result_patch.py, kind: regex, pattern: '^VERSION = "([^"]+)"', compare: version}
          - {id: patch-guard-direct, label: direct inputs patch 的版本守線, file: apps/n8n/n8n_mcp_admin/upstream_direct_patch.py, kind: regex, pattern: '^VERSION = "([^"]+)"', compare: version}
    exceptions: []
    notes:
      - "2026-10-24 兩邊一起升 2.96.2（PaaS woow-mcp-server #77＝4f09ba1 已合併、平台 develop seed #1975 已改釘；HA Woow_ha_mcp_addons 0.3.4＝PR #17，2026-10-24 發佈；0.3.2 版號未使用）。兩邊都對該版 dist/ 檔做位元組 patch 並在不符時拒絕啟動，升版要兩邊各自重算 digest。PaaS 版本釘點從 Dockerfile ARG 移到 apps/n8n/upstream-dependencies/。"
      - "n8n-mcp 宣告 @modelcontextprotocol/sdk 1.30.0，兩邊都用 overrides 升到 1.32.2。2.96.2 要求 Node ^22.23.4：兩邊 Node 一起升 22.23.4（node:22.23.4 映像，同一個 index digest）。"

  mcp-odoo:
    display_name: Odoo MCP（odoo-mcp）
    upstream: {package: "pypi:odoo-mcp", source: "github:tuanle96/mcp-odoo"}
    policy: {mode: lockstep, downgrade: allowed, hard_rules: []}
    target:
      version: "1.3.0"
      since: "2026-10-24"           # PaaS 採用日（woow-mcp-server #82；PyPI 發佈 2026-07-29）
      artifacts: {sdist: "sha256:5c1fb57c2ce6aadf354639da3438ebf700839eeb6f06cd87be42cbf9cdee76d3"}   # odoo_mcp-1.3.0.tar.gz（PyPI JSON digests）
      verified: "2026-10-24 PyPI JSON：odoo_mcp-1.3.0.tar.gz sha256 與 PaaS 根 uv.lock 相同；1.3.0 需要 mcp>=2（GitHub 上的 1.3.1／1.3.2 未發到 PyPI）"
    known_versions:
      - {version: "1.1.0", artifacts: {sdist: "sha256:335ff70d850af6a13416869217c656089032759624b6fe60b22732dc7b29debb"}}   # odoo_mcp-1.1.0.tar.gz：HA 0.3.x 現用
    legs:
      ha:
        fanout: {enabled: false, reason: "兩邊都對上游打版本專屬 patch／鎖檔，升版要人工重算"}
        repo: "github:WOOWTECH/Woow_ha_mcp_addons"
        ref: claude-delivery
        pins:
          - {id: pyproject, label: apps/odoo/pyproject.toml 相依, file: apps/odoo/pyproject.toml, kind: pep508, package: odoo-mcp, compare: version}
          - {id: uv-lock, label: apps/odoo/uv.lock 鎖定, file: apps/odoo/uv.lock, kind: uv_lock, package: odoo-mcp, compare: version}
          - {id: uv-lock-sdist, label: uv.lock sdist hash, file: apps/odoo/uv.lock, kind: uv_lock, package: odoo-mcp, field: sdist_sha256, parse: digest, compare: artifacts.sdist}
        package_version:
          - {label: add-on 版號, file: addons/odoo/config.yaml, kind: yaml, path: version}
        published: {kind: catalog, repo: "github:WOOWTECH/Woow_HA_App_Store", file: .addon-sync/catalog.json, id: woow_mcp_odoo}
      paas:
        fanout: {enabled: false, reason: "兩邊都對上游打版本專屬 patch／鎖檔，升版要人工重算"}
        repo: "gitea:WOOWTECH/woow-mcp-server"
        ref: main
        pins:
          - {id: pyproject, label: apps/odoo/pyproject.toml 相依, file: apps/odoo/pyproject.toml, kind: pep508, package: odoo-mcp, compare: version}
          - {id: uv-lock, label: 根 uv.lock 鎖定, file: uv.lock, kind: uv_lock, package: odoo-mcp, compare: version}
          - {id: uv-lock-sdist, label: 根 uv.lock sdist hash, file: uv.lock, kind: uv_lock, package: odoo-mcp, field: sdist_sha256, parse: digest, compare: artifacts.sdist}
    exceptions: []
    notes:
      - "2026-10-25 兩邊都是 odoo-mcp 1.3.0（需要 mcp 2.x）：PaaS woow-mcp-server #82、HA Woow_ha_mcp_addons 0.4.0（#22）。patch 組合不同屬包裝差異：HA 2 支（cross_session_token_store、direct_writes），PaaS 3 支（另有 fix_remove_3step_tools）加 4 個執行期修補（upstream_fixes、result_limits、tool_errors、concurrency）。"

