          - {id: opendesign, label: seed MCP 映像 opendesign-mcp-admin, file: src/data/cloud_app_templates.xml, kind: seed_image, record: cloud_app_mcp_opendesign, also_refs: [$stg_platform, develop], compare: identity.commit, match: prefix, digest: artifacts.opendesign-mcp-admin, history: "gitea:WOOWTECH/woow-mcp-server"}
          - {id: litellm, label: seed MCP 映像 litellm-mcp-admin, file: src/data/cloud_app_templates.xml, kind: seed_image, record: cloud_app_mcp_litellm, also_refs: [$stg_platform, develop], compare: identity.commit, match: prefix, digest: artifacts.litellm-mcp-admin, history: "gitea:WOOWTECH/woow-mcp-server"}
