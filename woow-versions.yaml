  # ============================================================== PaaS MCP 映像
  # 平台 8 個 MCP 範本（seed cloud_app_mcp_*）的映像都是 woow-mcp-server main 同一個 commit 的 CI 建置：
  # tag＝那個 commit（40 碼），digest＝那次建置。上面各 MCP 產品比的是原始碼裡的上游版本；這裡比的是平台範本
  # 實際會部署哪一次建置——正式站、staging 讀 CD 釘的平台版的 seed，develop 讀分支。
  # tag 不是目標 commit：清冊記得的舊 commit 依版號判落後；沒記的由 drift 問 Gitea 先後（之前＝🟠、之後＝🔵）。
  # tag 對了還要 digest 對（target.artifacts）。cloud_app_mcp_odoo_manage 不在內：odoo-manage 已移出
  # uv workspace（woow-mcp-server #82），映像停在 d5032a72，不隨 main 重建。
  woow-mcp-server:
    display_name: PaaS MCP 映像（woow-mcp-server commit）
    upstream: {source: "gitea:WOOWTECH/woow-mcp-server"}
    policy: {mode: lockstep, downgrade: allowed, hard_rules: []}
    target:
      version: "2026.10.27.1342"    # 無語意化版號：main commit 的 UTC 日期．時分（38a9041＝#89 合併，含 #87 第三輪、#88 未設定提示、#89 後端欄位）
      since: "2026-10-27"
      identity: {commit: "38a9041fb44de6d8848166473facd2f443e04710"}
      artifacts:                    # jcr-prod.woowtech.io/woow-paas-docker-local/<名稱>:<commit> 的 digest
        hermes-mcp-admin: "sha256:7a9c78d217e6e0c5d3861fa05c9fd046698943bcddfe0ca2e857cc6e20b49636"
        odoo-mcp-admin: "sha256:9c33cca0b3b368aff094eabf6d0409ce132858105a13ec05cb1f040d2cc68bc9"
        n8n-mcp-admin: "sha256:f26f7dae420e5486098c6b7f134445aeda47d36929a04620d6c68c723d13492a"
        k8s-mcp-admin: "sha256:274691eff9430f1bb6865b094b71844f6ba879a86c85a74ca4789aaa64704e36"
        vk-mcp-admin: "sha256:959aa642af4d0447b2c961941ba66b04ecdc86a10c89224d11c67efef133c650"
        opendesign-mcp-admin: "sha256:50e2e97e6e72f14e85f572094a4d6488169deaebb07934e3546358a44af881b1"
        litellm-mcp-admin: "sha256:1f49fd9aa3b38ce71441ec5bb2733b243d52b891030f54686ab101ac3c582ea0"
        nextcloud-mcp-admin: "sha256:ad3e4dd18f0c642e33ce9a8cafef28aaa7012fe528c8daa54d7427910a5bfbc8"
      verified: "2026-10-27：woow-mcp-server main＝38a9041（2026-10-27T13:42:51Z，#89 合併）；8 個 tag@digest 以 HEAD /v2/…/manifests 從 jcr-prod 讀回，與 main CI run 30718 推送紀錄逐一相同；平台 develop 已由 #2052 改釘（正式站／staging 等 18.0.1.0.274 發版；正式站服務目前是 #86 1dcabf91）"
