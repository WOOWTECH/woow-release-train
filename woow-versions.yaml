# woow-versions.yaml — HA ↔ PaaS 版本清冊（唯一真相來源）
#
# 負責人決定（2026-10-15／16，見 README.md）：
#   - HA 與 PaaS 都對齊這份清冊；Podman／k3s 不在範圍內，不建模。
#   - lockstep：EMQX、LiteLLM、OpenDesign、MCP servers（之後 code-server）
#     range：n8n、Hermes、MCP Python SDK（之後 Omnigent、Headscale、Tailscale）
#   - 第 3 期（2026-10-24）加入 Hermes、OpenDesign、MCP servers：先只觀測，hard_rules 留空，
#     OpenDesign／MCP 的 fanout 關閉（要人工匯入 core、重算 patch）。
#   - 第 0 期只報告；第 1 期（2026-10-24 起）兩邊 CI 都跑 `wvt check`，
#     只有各產品 policy.hard_rules 會擋，其他只警告。
#
# 規則：
#   - 只比「上游身分」（版本＋index digest＋各架構 digest）。add-on 版號、chart 版號、
#     JCR 時間戳 tag 都是各邊自己的包裝，只列 package_version 參考，不跨邊比較。
#   - 版本、日期一律加引號（解析器不做隱式型別轉換以外的猜測）。
#   - 例外必須有理由、核准人、到期日；到期後 `wvt validate` 失敗。
#   - 改這份檔＝改版本政策：一律開 PR，人工合併。
#
# 格式：YAML 子集（區塊 mapping／sequence、單行 flow、引號字串、註解），由
# tools/wvt.py 內建的解析器讀取（不需 PyYAML）。

schema: 1
phase: 1            # 0 只報告 → 1 警告＋硬規則 → 2 機器人開 PR → 3 擴大產品
# 各邊 CI 的 `wvt check` 不帶 --fail-on，照這個值決定擋什麼：
#   report-only＝都不擋（緊急開關）；hard-rules＝只擋 hard_rules；strict＝任何漂移都擋。
enforcement: hard-rules

sources:
  # 正式站 Fleet 釘的平台版（Odoo 映像建自哪個 woow_paas_platform tag）。
  # 該 tag 只寫在 image 區塊的註解（"Built from addon_ref v18.0.1.0.NNN"），
  # wvt 讀第一個出現的 addon_ref；讀不到就只比 develop 並在報告備註。
  prod_platform:
    repo: "gitea:woow-paas/paas-app-bundle-cd"
    file: paas-odoo-platform/values-prod.yaml
    ref: main
    kind: cd_addon_ref

# 只測連線、不影響漂移判定：第 2 期機器人要從 Gitea runner 打 GitHub API 開 PR。
probes:
  api.github.com: https://api.github.com/rate_limit

# 第 2 期機器人（tools/wvtbot.py，.gitea/workflows/bots.yml）。off＝不做；dry-run＝只在 Actions 摘要列計畫；
# open-pr＝推機器人分支、開／更新／關閉 PR。機器人永遠不合併、不簽 /approve；改這裡也要開 PR、人工合併。
bots:
  propose: open-pr        # 某一邊比清冊新 → 本 repo 的清冊 PR（版本負責人合併）
  fanout_ha: dry-run      # 清冊比 HA 新 → HA repo PR；GitHub App（WVT_GH_APP_ID／WVT_GH_APP_PRIVATE_KEY）建好後改 open-pr
  fanout_paas: dry-run    # 清冊比 PaaS 新 → mirror-image（人工 /approve）＋PaaS PR；Gitea 機器人帳號定案後改 open-pr

products:

  # ------------------------------------------------------------------ EMQX
  emqx:
    display_name: EMQX
    upstream:
      image: docker.io/emqx/emqx
      source: "github:emqx/emqx"
      artifact_sha256:   # HA 自建用的官方 tarball；propose 從這裡取新版的 sha256
        debian13-amd64: "https://github.com/emqx/emqx/releases/download/v{version}/emqx-{version}-debian13-amd64.tar.gz.sha256"
        debian13-arm64: "https://github.com/emqx/emqx/releases/download/v{version}/emqx-{version}-debian13-arm64.tar.gz.sha256"
    policy:
      mode: lockstep
      license_ceiling: "<5.9.0"   # 5.9+ 是 BSL-1.1（woow-paas-charts charts/emqx/Chart.yaml 描述）
      downgrade: allowed
      hard_rules: [license_ceiling, exception_expired]   # 第 1 期起生效
    target:
      version: "5.8.9"
      since: "2026-10-02"
      index_digest: "sha256:35b46f7aa7a0d51f3959e4344221ac5ec7f948b03e43099286b6c40a07bb393b"
      platforms:
        amd64: "sha256:8b92a101d1a1642a191507b9133c46aad095bb64300dba1770108a2c7261b11a"
        arm64: "sha256:c455c60feced3452a5fa81a761f840983039118b1c126fdad6c86f93467a3be5"
      artifacts:
        # HA 不用映像，而是下載官方 tarball 自建；sha256 取自上游 release 的 .sha256 檔
        debian13-amd64: "sha256:c3b5a8f7c83601867d0fc1ef19a851f6f16f56a9436de74cb05f81f188a44a90"
        debian13-arm64: "sha256:524b5dd8ccad1f7dc5e5c15171328618e1ea7703fed56e17006a27258a13ecd4"
      verified: "2026-10-16 crane manifest docker.io/emqx/emqx:5.8.9；tarball sha256 對照 github.com/emqx/emqx/releases/download/v5.8.9/*.sha256"
    legs:
      ha:
        repo: "github:WOOWTECH/Woow_ha_emqx"
        ref: main
        pins:
          - id: upstream
            label: 上游版本
            file: emqx/Dockerfile
            kind: dockerfile_arg
            name: EMQX_VERSION
            strip_v: true
            compare: version
          - id: tarball-amd64
            label: tarball sha256（amd64）
            file: emqx/Dockerfile
            kind: dockerfile_arg
            name: EMQX_SHA256_AMD64
            parse: digest
            compare: artifacts.debian13-amd64
          - id: tarball-arm64
            label: tarball sha256（arm64）
            file: emqx/Dockerfile
            kind: dockerfile_arg
            name: EMQX_SHA256_ARM64
            parse: digest
            compare: artifacts.debian13-arm64
        package_version:
          - label: add-on 版號
            file: emqx/config.yaml
            kind: yaml
            path: version
            bump: patch          # fanout：上游換版時 add-on +0.0.1（5.9.1 包 5.8.9，不跟上游同號）
            note: "add-on 版號 ≠ 上游版號（5.9.1 包 5.8.9；Store 拒絕降版）；授權上限只看上游"
        fanout:
          changelog: emqx/CHANGELOG.md
        published:
          kind: catalog
          repo: "github:WOOWTECH/Woow_HA_App_Store"
          file: .addon-sync/catalog.json
          id: woow-emqx
      paas:
        pins:
          - id: seed
            label: 平台範本 seed
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_image
            record: cloud_app_emqx
            compare: platforms.amd64
          - id: chart
            label: chart appVersion
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/emqx/Chart.yaml
            kind: yaml
            path: appVersion
            compare: version
        mirror:                  # seed 釘 JCR 的 tag@amd64 digest：fanout 先 dispatch mirror-image
          dest_name: emqx
          digest: platforms.amd64
        package_version:
          - label: seed chart 版號
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_field
            record: cloud_app_emqx
            field: helm_chart_version
          - label: charts 已發佈版號
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/emqx/Chart.yaml
            kind: yaml
            path: version
            bump: patch
    exceptions: []

  # --------------------------------------------------------------- LiteLLM
  litellm:
    display_name: LiteLLM
    upstream:
      image: ghcr.io/berriai/litellm-non_root
      source: "github:BerriAI/litellm"
    policy:
      mode: lockstep
      downgrade: allowed
      hard_rules: [digest, shared_files, exception_expired]   # 第 1 期起生效
    target:
      version: "1.104.0"
      since: "2026-10-10"
      index_digest: "sha256:37066242e6b8327fdd627682a66a9ae2a599553b4d5a84c905c6d8b9eb35c01e"
      platforms:
        amd64: "sha256:843a35c72a832e9c062b66111b1aa54e6588fb32c3ab400d3e20ea9c5fa656a0"
        arm64: "sha256:fdac774ed3b9bc1e00a04469d960fc5655e42289d7997a8afff0d64b45dc753e"
      verified: "2026-10-16 crane manifest ghcr.io/berriai/litellm-non_root:1.104.0"
    shared_files:
      # Woow 外掛（ChatGPT 訂閱等）由 charts 單一來源，HA 逐位元組複製並寫 lock。
      # charts main 另有 PaaS 專用的 woow_revoke_ui_sessions.py，不在共用清單內。
      # 來源（PaaS）可以先改：charts 的 CI 對改過的共用檔只警告；合併後開清冊 PR 換 commit／blobs，
      # 舊的一組移到 known_commits（HA 的 lock 停在舊 commit 只算落後，不擋 HA 其他 PR）。
      - source:
          leg: paas
          repo: "gitea:woow-paas/woow-paas-charts"
          path: charts/litellm/files/
          branch: main
          commit: "d3cd6898b29a9e094fd616bc151399c9884e5c19"
          require_on_main: true
          files: [sitecustomize.py, woow_chatgpt.py, woow_chatgpt_plugin.py, woow_ui_cookie_hardening.py, woow_body_limit.py, woow_usage_limit.py, woow_reasoning.py, woow_unpriced.py, woow_upstream_errors.py]
          blobs:   # git blob（git rev-parse <commit>:<path><file>）
            sitecustomize.py: "9fafb94e9ac1f927d79a38d2101aefcb1f4660dc"
            woow_chatgpt.py: "1603136fd6794f259c496d0501a71105a39b1e15"
            woow_chatgpt_plugin.py: "f766e88f8279f8220eefe39cde5cfb82001c65bd"
            woow_ui_cookie_hardening.py: "dd1c42a7dc649959263d1c466753554ac1c08a50"
            woow_body_limit.py: "d861175cc9998821c9876d62453b328488723be0"
            woow_usage_limit.py: "2b162cb0f19632d4d7caa44359b5734eed85e44a"
            woow_reasoning.py: "ece1f8a5c966a6d8b7a9e0e3c39510952275cc59"
            woow_unpriced.py: "6c4477156f400fb2ecb1a3cc96aba51089da7186"
            woow_upstream_errors.py: "77aab32bbd6a41a85ebd3846712a7fa106cb6ec3"
        known_commits:
          - commit: "4ad95a11d8dad671b342d6cc9454c87a3130e8b6"
            blobs:
              sitecustomize.py: "f5407aacd4ed0d0202da7d6c578ef6a267b8a45b"
              woow_chatgpt.py: "527c16c68a83958cc2f124253632b98de20b56c6"
              woow_chatgpt_plugin.py: "cfcd0f65c257f44db3e995ea6fd635e76c7255f3"
        consumers:
          - leg: ha
            repo: "github:WOOWTECH/Woow_ha_litellm"
            lock: litellm/woow-plugin.lock.json
    legs:
      ha:
        repo: "github:WOOWTECH/Woow_ha_litellm"
        ref: main
        pins:
          - id: base-image
            label: 上游 base 映像
            file: litellm/Dockerfile
            kind: dockerfile_arg
            name: LITELLM_IMAGE
            parse: image_ref
            compare: index_digest
          # Dockerfile 的每個釘點都必須等於 upstream.lock.json（HA repo tests/test_config_contract.py）
          - id: lock-tag
            label: upstream.lock.json tag
            file: litellm/upstream.lock.json
            kind: json
            path: tag
            compare: version
          - id: lock-version
            label: upstream.lock.json litellm_version
            file: litellm/upstream.lock.json
            kind: json
            path: litellm_version
            compare: version
          - id: lock-index
            label: upstream.lock.json index_digest
            file: litellm/upstream.lock.json
            kind: json
            path: index_digest
            parse: digest
            compare: index_digest
        package_version:
          - label: add-on 版號
            file: litellm/config.yaml
            kind: yaml
            path: version
            bump: patch
            note: "私人映像，只裝公司 HA，不在 Store catalog"
        fanout:
          changelog: litellm/CHANGELOG.md
          changelog_entry: "- 上游 {name} {old} → {new}（woow release train 清冊）。合併前請改成實際變更說明。"
          changelog_shared: "- Woow 外掛同步到 woow-paas-charts {commit}（woow release train 清冊）。合併前請改成實際變更說明。"
      paas:
        pins:
          - id: ci-base
            label: paas-odoo-ci 建置 base
            repo: "gitea:woow-paas/paas-odoo-ci"
            ref: main
            file: litellm/Dockerfile
            kind: dockerfile_arg
            name: BASE
            parse: image_ref
            compare: index_digest
          - id: chart-digest
            label: chart values 上游 digest
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/litellm/values.yaml
            kind: yaml
            path: image.digest
            parse: digest
            compare: index_digest
            mirror: true           # values 指向 JCR：新 digest 要先鏡像
          - id: chart-tag
            label: chart values JCR tag（fanout 一起改）
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/litellm/values.yaml
            kind: yaml
            path: image.tag
            compare: info
            write: "{jcr_tag}"
          - id: chart
            label: chart appVersion
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/litellm/Chart.yaml
            kind: yaml
            path: appVersion
            compare: version
          - id: seed-wrapper
            label: seed 映像（Woow 包裝，非上游身分）
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_image
            record: cloud_app_litellm
            compare: info
        package_version:
          - label: seed chart 版號
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_field
            record: cloud_app_litellm
            field: helm_chart_version
          - label: charts 已發佈版號
            repo: "gitea:woow-paas/woow-paas-charts"
            ref: main
            file: charts/litellm/Chart.yaml
            kind: yaml
            path: version
            bump: patch
        mirror:
          dest_name: litellm
          digest: index_digest
    exceptions:
      - leg: ha
        what: "ChatGPT Responses 相容修補（Woow_ha_litellm UPSTREAM.md）"
        reason: "HA 2026-10-13 驗收重現三個 ChatGPT /v1/responses 問題；修補尚未經 PaaS 覆核，base digest 兩邊仍相同"
        approved_by: "負責人（2026-10-16 第 0 期決定）"
        expires: "2026-11-15"

  # ------------------------------------------------------------------- n8n
  n8n:
    display_name: n8n
    upstream:
      image: docker.io/n8nio/n8n
      source: "github:n8n-io/n8n"
      tag_pattern: "n8n@{version}"
    policy:
      mode: range
      min_version: "2.38.0"       # n8n#37006 修正（Respond 節點前失敗卻回 HTTP 200）；seed 註解
      max_days_behind: 30
      downgrade: forbidden        # 資料庫遷移單向（Woow_ha_n8n README）
      upgrade_evidence: required  # clone→升級→還原的證據，比照 woow_paas_platform docs/verification
      hard_rules: []              # range 產品第 1 期仍只警告
    target:
      version: "2.43.6"
      since: "2026-10-15"         # HA add-on 2.43.6 發佈日
      index_digest: "sha256:dd580fe1ab6e99e85bc66f2acf8bc8c5e9409fbe61b2e2803c5024403ef52833"
      platforms:
        amd64: "sha256:371dd463f02e8c35a4bc5aaf9855fc4cfec1babab97e5a02a1e31923a2ec8f5a"
        arm64: "sha256:4648e019655401905bd394a3bf448f8abaca900bd2722a5770c375df2762b6ca"
      verified: "2026-10-16 crane manifest docker.io/n8nio/n8n:2.43.6"
    known_versions:
      # 讓 drift 能把 PaaS 釘的 digest 換算回版本（皆 2026-10-16 crane 驗證）
      - version: "2.38.0"
        index_digest: "sha256:fd3494ec0a86809cb02120143ef7800518c81dc926a5c9f0ff808e3922a725ef"
        platforms:
          amd64: "sha256:e0e7b603b43adc48d7123716b9eee7394dca675b410f574e4d24830e114564ce"
          arm64: "sha256:3a6320c22455fe191adef6220e7e4a53c1dbd89691ca1d0b77cb2f7c882362be"
      - version: "2.35.3"
        index_digest: "sha256:31375a4f730081a139bba2d379bf2efaa8e662cc9e131d12bb5e15859d4f0282"
        platforms:
          amd64: "sha256:a3693cff4b9fff5ffce6d20470f2d87a905c073c0de46ea65404e89947c6dfa2"
          arm64: "sha256:91d70791dfa78b5bd9fe2c5d49a11120efa62a8cfad7d74367cea6f47b26a27a"
    legs:
      ha:
        repo: "github:WOOWTECH/Woow_ha_n8n"
        ref: main
        pins:
          - id: upstream
            label: 上游版本
            file: n8n/Dockerfile
            kind: dockerfile_arg
            name: N8N_UPSTREAM_VERSION
            compare: version
        package_version:
          - label: add-on 版號
            file: n8n/config.yaml
            kind: yaml
            path: version
            bump: same           # n8n add-on 版號＝上游版號
          - label: 建置版號（BUILD_VERSION）
            file: n8n/Dockerfile
            kind: dockerfile_arg
            name: BUILD_VERSION
            bump: same
        fanout:
          changelog: n8n/CHANGELOG.md
        published:
          kind: catalog
          repo: "github:WOOWTECH/Woow_HA_App_Store"
          file: .addon-sync/catalog.json
          id: woow-n8n
      paas:
        pins:
          - id: seed
            label: 平台範本 seed
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            also_refs: [develop]
            file: src/data/cloud_app_templates.xml
            kind: seed_image
            record: cloud_app_n8n
            compare: platforms.amd64
        mirror:
          dest_name: n8n
          digest: platforms.amd64
        package_version:
          - label: 外部 chart（8gears）版號
            repo: "gitea:odoo-addons/woow_paas_platform"
            ref: $prod_platform
            file: src/data/cloud_app_templates.xml
            kind: seed_field
            record: cloud_app_n8n
            field: helm_chart_version
            note: "8gears 2.0.1 沒有 startupProbe（seed 以 liveness initialDelay 補）"
    exceptions: []
    notes:
      - "PaaS 已於 10-16 隨平台 .243 升到 2.43.6（JCR n8n:20261015.2215 ← docker.io/n8nio/n8n@sha256:371dd463…，amd64）；遷移單向，既有服務逐台備份後 Redeploy。"

  # ================================================================ Hermes
  # 上游身分＝docker.io/nousresearch/hermes-agent 的 index digest。HA 直接 FROM；PaaS 在 paas-odoo-ci
  # 以同一 digest 為底建 Woow 衍生映像（seed 釘的是衍生映像，不是上游 digest，所以 seed 只列參考）。
  hermes:
    display_name: Hermes Agent
    upstream:
      image: docker.io/nousresearch/hermes-agent
      source: "github:NousResearch/hermes-agent"
      tag_pattern: "v{version}"     # v0.21.0 以前是日曆 tag（v2026.8.31＝v0.21.0）；上游 tag 會被重推，一律以 digest 為準
      image_tag: "v{version}"       # propose 到 registry 查的 tag
    policy:
      mode: range
      min_version: "0.22.5"         # 已驗證內含 X-FIX-CVE 全部 8 項相依修補（paas-odoo-ci hermes-agent/Dockerfile:80；0.21.6 靠 hash 鎖定 overlay，4749031 已移除）
      max_days_behind: 30
      downgrade: forbidden          # state.db／config schema 單向（HA CHANGELOG 0.1.10 末句；seed 0.3.6 註解）
      upgrade_evidence: required
      hard_rules: []
    target:
      version: "0.22.5"
      since: "2026-10-23"           # 上游 release 2026-10-23T05:28Z；HA add-on 0.1.10 同日發佈
      index_digest: "sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d"
      platforms:
        amd64: "sha256:fd822bae0a61bf023450737edbeaeea5fc6460f17cb4ee240a7e67b306ed63fb"
        arm64: "sha256:41f1cfdd2486b38ca55453a28785910b498ee184e71eed4f2d7ee3f908aa7236"
